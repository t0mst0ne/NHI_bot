name: Daily NHI Scan & Telegram Alert

on:
  schedule:
    # 每日台灣時間 12:00 (UTC+8) = UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊「Run workflow」立即執行

permissions:
  contents: write # 允許 Action 自動將更新後的 data/ 歷史紀錄 commit 回倉庫

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NHI Scan & Push Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python main.py --scan-once

      - name: Commit and push updated state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          # 檢查是否有新公文寫入 data/，若有變動才 commit 並 push 回 main
          if ! git diff --staged --quiet; then
            git commit -m "chore: update processed announcements state [skip ci]"
            git push
          else
            echo "No new announcements found today. Database is already up to date."
          fi
